        description: |
          ### Column: Unique Key  

          This column represents the **unique key** for the orders mart.  
          It is used as the primary identifier for downstream joins.  

          #### Why it's important:
          - Guarantees uniqueness across customers  
          - Enables reliable analytics  
          - Ensures consistent referential integrity  

          #### Example Values
          ```
          CUST_001
          CUST_002
          CUST_003
          ```

          #### Extra Notes  
          This is deliberately long and repetitive so you can **test UI constraints**:  
          - Long text wrapping  
          - Markdown tables inside column descriptions  
          - Large code blocks  

          | Key        | Status   |
          |------------|----------|
          | CUST_001   | Active   |
          | CUST_002   | Inactive |
          | CUST_003   | Active   |
